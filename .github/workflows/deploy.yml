name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

# Pull requests verify with read-only access
# Releases report project changes, refresh the site cover, and deploy
permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE_HOST: ${{ vars.SITE_HOST }}

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and refresh site cover
        run: npm run capture:cover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_CHANGE_BASELINE: deployed

      - name: Commit refreshed site cover
        run: |
          if git diff --quiet -- docs/screenshots/cover.png; then
            echo "Site cover is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/cover.png
          git commit -m "docs: refresh site cover screenshot"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Deploy to Cloudflare
        run: npm run deploy -- --message "Deployed by GitHub Actions from $(git rev-parse HEAD)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
