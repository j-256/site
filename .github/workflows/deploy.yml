name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

# Least privilege, scoped per job: build only reads the repo, while the deploy
# job only calls the secret Cloudflare Deploy Hook
# The weekly cron rebuilds the live site with fresh upstream metadata
permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE_HOST: ${{ vars.SITE_HOST }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare build
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --request POST "$CLOUDFLARE_DEPLOY_HOOK_URL" \
            | jq --exit-status '.success == true and (.result.build_uuid | type == "string")'
