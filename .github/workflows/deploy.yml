name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

# The build job verifies and deploys the same artifact
# Pull requests stop after verification, while other runs publish to Cloudflare
# The weekly cron refreshes the live site with upstream repository metadata
permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SITE_HOST: ${{ vars.SITE_HOST }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        run: npm run deploy -- --message "Deployed by GitHub Actions from ${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
