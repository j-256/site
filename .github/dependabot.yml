version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "02:30"
      timezone: "America/Chicago"
    groups:
      all-dependencies:
        patterns:
          - "*"
    # Astro check requires TypeScript 5 or 6
    ignore:
      - dependency-name: "typescript"
        versions: ["7.x"]
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "02:30"
      timezone: "America/Chicago"
    groups:
      all-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"
